<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/app-icon.jpg" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/app-icon.jpg" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="A premium modern dating app to find your perfect match" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="DateApp" />
  <meta name="mobile-web-app-capable" content="yes" />

  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

  <title>Dating App</title>

  <style>
    /* Splash screen styling */
    body { margin: 0; padding: 0; }
    #root:empty {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #000000;
    }
    #root:empty::after {
      content: '';
      width: 48px;
      height: 48px;
      border: 3px solid rgba(244,63,94,0.2);
      border-top-color: #f43f5e;
      border-radius: 50%;
      animation: splash-spin 0.8s linear infinite;
    }
    @keyframes splash-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>

  <script>
    // Register Service Worker for PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then((reg) => console.log('SW registered:', reg.scope))
          .catch((err) => console.log('SW registration failed:', err));
      });
    }
  </script>
</body>

</html>
